  # ----- Finance -------------------------------------------------------
  # Phase 1: read-only Stripe ingest + CODB registry + runway math.
  # HTTP-only (no SQS worker sidecar yet — no samus-finance-jobs queue).
  # STRIPE_API_KEY is optional: the workcell degrades to "stripe_api_key_unset"
  # and still serves /codb_summary + /runway (with balance=0) without it.
  samus-finance:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/finance/Dockerfile
    image: samus/finance:local
    container_name: samus-finance
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
      # REAL cash source: the Found business-bank activity export lives in the
      # operator's tax-docs dir. Mounted READ-ONLY so get_runway/get_snapshot can
      # total the latest *activity_report*.csv → the true bank balance, replacing
      # Stripe's auto-swept ~$0 available balance. Path is relative to this compose
      # file (../../.. = repo parent = D:\Hustleforge). See backend/finance/found_cash.py.
      - type: bind
        source: "../../../Executive Docs/04_Tax"
        target: /opt/samus/exec_docs/tax
        read_only: true
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: finance
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      SAMUS_FOUND_ACTIVITY_DIR: /opt/samus/exec_docs/tax
      # Mercury READ-ONLY bank API — the live real-cash source once Stripe payouts
      # land in Mercury. WIRE-NOT-ARM: flag default OFF; flip to 1 only after the
      # money is actually in Mercury. Token is a READ-ONLY Mercury token
      # (DPAPI AnthropicApiKey-style: Start-SamusStack seeds MercuryApiToken ->
      # MERCURY_API_TOKEN). Absent/off => Found CSV → Stripe fallback.
      SAMUS_MERCURY_ENABLED: ${SAMUS_MERCURY_ENABLED:-false}
      MERCURY_API_TOKEN: ${MERCURY_API_TOKEN:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Lets the Stripe webhook close-the-loop dispatch reach samus-crm
      # via the gateway -> samus-crm-jobs SQS queue.
      GATEWAY_URL: http://samus-gateway:8080
      # SendGrid Mail Send + EMAIL_BACKEND are now defined ONCE in the
      # &samus-common-env anchor so every workcell that can dispatch mail
      # (finance, outreach, cash-engine-worker) inherits them. The
      # finance-only block here was removed 2026-06-22 when cash_engine
      # live-send needed the creds too.
      # Comma-separated whitelist of hf_offer_code values that trigger
      # post-payment auto-fulfill (Win #2). Empty = operator-only manual
      # Run-Fulfill.ps1 for every sale. Requires the payment_link to also
      # expose a `website_url` checkout custom_field; without it the
      # handler skips even whitelisted offers.
      SAMUS_AUTO_FULFILL_OFFERS: ${SAMUS_AUTO_FULFILL_OFFERS:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

  # ----- CRM -----------------------------------------------------------
  # Phase 1: owns the 7 cross-cutting customer-pipeline tables
  # (prospects, contacts, conversations, call-State, opportunities,
  # operator_tasks, artifacts). HTTP-only — no SQS worker sidecar yet,
  # no public surface (network: samus-internal only). Other workcells
  # dispatch via HMAC for any CRM mutation.
  samus-crm:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/crm/Dockerfile
    image: samus/crm:local
    container_name: samus-crm
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: crm
      DDB_PROSPECTS_TABLE: ${DDB_PROSPECTS_TABLE:-samus_prospects}
      DDB_CONTACTS_TABLE: ${DDB_CONTACTS_TABLE:-samus_contacts}
      DDB_CONVERSATIONS_TABLE: ${DDB_CONVERSATIONS_TABLE:-samus_conversations}
      DDB_CALL_STATE_TABLE: ${DDB_CALL_STATE_TABLE:-samus_call-State}
      DDB_OPPORTUNITIES_TABLE: ${DDB_OPPORTUNITIES_TABLE:-samus_opportunities}
      DDB_OPERATOR_TASKS_TABLE: ${DDB_OPERATOR_TASKS_TABLE:-samus_operator_tasks}
      DDB_ARTIFACTS_TABLE: ${DDB_ARTIFACTS_TABLE:-samus_artifacts}
      DDB_ONBOARDING_LEADS_TABLE: ${DDB_ONBOARDING_LEADS_TABLE:-samus_onboarding_leads}
      SAMUS_CRM_AUDIT_PATH: /opt/samus/data/crm/crm_audit.jsonl
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

  # ----- CRM worker sidecar -------------------------------------------
  # Drains the samus-crm-jobs SQS queue. Producers (seo, proposal, finance
  # webhook) dispatch CRM mutations through the gateway -> SQS path so
  # they survive Cloud Run scale-to-zero (a daemon-thread approach does
  # not). This worker consumes those messages and routes by envelope
  # action to the CRM service functions. Action router lives in
  # backend/crm/worker.py::_handle_action and mirrors the /work HTTP
  # endpoint actions one-for-one, plus a collapsed
  # ``close_payment_to_opportunity`` for the finance close-the-loop flow.
  samus-crm-worker:
    <<: *samus-common
    image: samus/crm:local
    container_name: samus-crm-worker
    command: ["python", "-m", "backend.crm.worker"]
    depends_on:
      samus-crm:
        condition: service_started
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: crm
      SQS_CRM_QUEUE_URL: ${SQS_CRM_QUEUE_URL:-}
      DDB_PROSPECTS_TABLE: ${DDB_PROSPECTS_TABLE:-samus_prospects}
      DDB_CONTACTS_TABLE: ${DDB_CONTACTS_TABLE:-samus_contacts}
      DDB_CONVERSATIONS_TABLE: ${DDB_CONVERSATIONS_TABLE:-samus_conversations}
      DDB_CALL_STATE_TABLE: ${DDB_CALL_STATE_TABLE:-samus_call-State}
      DDB_OPPORTUNITIES_TABLE: ${DDB_OPPORTUNITIES_TABLE:-samus_opportunities}
      DDB_OPERATOR_TASKS_TABLE: ${DDB_OPERATOR_TASKS_TABLE:-samus_operator_tasks}
      DDB_ARTIFACTS_TABLE: ${DDB_ARTIFACTS_TABLE:-samus_artifacts}
      DDB_ONBOARDING_LEADS_TABLE: ${DDB_ONBOARDING_LEADS_TABLE:-samus_onboarding_leads}
      SAMUS_CRM_AUDIT_PATH: /opt/samus/data/crm/crm_audit.jsonl
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib,sys; sys.exit(0 if 'backend.crm.worker' in pathlib.Path('/proc/1/cmdline').read_text() else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

  # ----- Cash Engine worker sidecar -----------------------------------
  # Drains the samus-cash-engine-jobs SQS queue. The front door
  # (POST /api/samus/review_opportunity on the gateway) and the signal_decay
  # trigger enqueue RevenueTriggerEnvelopes; this worker pulls each and walks
  # it through the staged sequence (audit -> proposal -> contact -> outreach
  # -> dormant) via backend/cash_engine/worker.py::process_job (idempotent per
  # deal, so SQS redelivery is safe; failures redrive to DLQ).
  #
  # FAT WORKER: the staged handlers call into seo.audit, proposal, outreach,
  # prospecting, and crm. It runs on the gateway image (samus/gateway:local),
  # which already imports the cash_engine subsystem at boot — but those leaf
  # modules are imported lazily inside the handlers, so the gateway image MUST
  # carry their runtime deps (beautifulsoup4, dnspython, httpx) for
  # the audit/proposal/outreach stages to run; otherwise a job redrives to DLQ.
  #
  # With SQS_CASH_ENGINE_QUEUE_URL unset the receive loop idles harmlessly and
  # the no-SQS path is the gateway's /api/samus/cash_engine/drain over the JSONL
  # mock queue. Set the URL (and provision the queue + a DLQ redrive policy) to
  # go live. Live email stays gated by SAMUS_CASH_ENGINE_LIVE_SEND (default off).
  samus-cash-engine-worker:
    <<: *samus-common
    image: samus/gateway:local
    container_name: samus-cash-engine-worker
    command: ["python", "-m", "backend.cash_engine.worker"]
    depends_on:
      samus-gateway:
        condition: service_started
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: cash_engine
      SQS_CASH_ENGINE_QUEUE_URL: ${SQS_CASH_ENGINE_QUEUE_URL:-}
      # Outreach send stays drafted-only unless the operator opts in here AND
      # SES_FROM_EMAIL is set; postal address + unsubscribe satisfy CAN-SPAM.
      SAMUS_CASH_ENGINE_LIVE_SEND: ${SAMUS_CASH_ENGINE_LIVE_SEND:-}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-}
      SAMUS_SENDER_POSTAL_ADDRESS: ${SAMUS_SENDER_POSTAL_ADDRESS:-}
      SAMUS_UNSUBSCRIBE_URL: ${SAMUS_UNSUBSCRIBE_URL:-}
      DDB_PROSPECTS_TABLE: ${DDB_PROSPECTS_TABLE:-samus_prospects}
      DDB_CALL_STATE_TABLE: ${DDB_CALL_STATE_TABLE:-samus_call-State}
      DDB_OPPORTUNITIES_TABLE: ${DDB_OPPORTUNITIES_TABLE:-samus_opportunities}
      DDB_OPERATOR_TASKS_TABLE: ${DDB_OPERATOR_TASKS_TABLE:-samus_operator_tasks}
      DDB_ARTIFACTS_TABLE: ${DDB_ARTIFACTS_TABLE:-samus_artifacts}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib,sys; sys.exit(0 if 'backend.cash_engine.worker' in pathlib.Path('/proc/1/cmdline').read_text() else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
          pids: 128

  # ----- Intake --------------------------------------------------------
  # Phase 1: public-facing receiver for the onboarding form on
  # hustleforge.tech/onboarding/. HTTP-only (no SQS worker yet).
  #
  # Networks: samus-edge AND samus-internal. Browser POSTs from the
  # marketing site land here through Cloud Run / Caddy / ngrok depending
  # on environment (production: api.hustleforge.tech -> Cloud Run
  # samus-intake-2026). No `ports:` block — local dev uses an ngrok-style
  # tunnel or hits the container through the gateway.
  #
  # CORS allow-list is driven by SAMUS_INTAKE_ALLOWED_ORIGINS (default
  # https://hustleforge.tech); change without rebuilding.
  samus-intake:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/intake/Dockerfile
    image: samus/intake:local
    container_name: samus-intake
    networks:
      - samus-edge
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
      # Per-client campaign config read by backend.crm.client_directory on
      # every inbound email so signed/existing-client mail is categorized as
      # client_correspondence (not lumped with cold-prospect replies).
      # RO: operators add clients/<slug>/campaign.yaml without a rebuild;
      # the container must never mutate it.
      - type: bind
        source: ../../clients
        target: /opt/samus/clients
        read_only: true
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: intake
      DDB_ONBOARDING_LEADS_TABLE: ${DDB_ONBOARDING_LEADS_TABLE:-samus_onboarding_leads}
      SAMUS_INTAKE_ALLOWED_ORIGINS: ${SAMUS_INTAKE_ALLOWED_ORIGINS:-https://hustleforge.tech}
      SAMUS_INTAKE_DEDUP_WINDOW_S: ${SAMUS_INTAKE_DEDUP_WINDOW_S:-86400}
      SAMUS_INTAKE_AUDIT_PATH: /opt/samus/data/intake/intake_audit.jsonl
      # Site telemetry ingest (backend/intake/telemetry.py).
      # POST /intake/telemetry — page_view / form_view / pricing_view /
      # form_submit_view / buy_click beacons from hustleforge.tech. When
      # OFF the endpoint returns 200 with status='dropped_disabled' so the
      # site beacon never looks broken; when ON, events land in the JSONL
      # ledger below. Wired 2026-07-03 as part of the funnel-audit
      # remediation.
      SAMUS_TELEMETRY_INGEST_ENABLED: ${SAMUS_TELEMETRY_INGEST_ENABLED:-false}
      SAMUS_INTAKE_TELEMETRY_PATH: /opt/samus/data/intake/site_telemetry.jsonl
      # Website onboarding-form warm-lead enrollment
      # (backend/outreach/buying_signal_route.maybe_enroll_buying_signal_from_website_form).
      # When a form submission carries declared service_interest (not empty,
      # not just 'not_sure'), the intake handler enrolls the lead into the
      # same warm buying_signal sequence used by voice + email_reply.
      # Independent of the voice-path OUTREACH_BUYING_SIGNAL_ROUTE_ENABLED
      # flag — this arms website-sourced enrollments only. Sending remains
      # a separate dormant step (dispatch_due_buying_signal needs a composer +
      # dry_run=False). Scoped to intake so arming recreates only samus-intake.
      OUTREACH_WEBSITE_FORM_WARM_ENROLL_ENABLED: ${OUTREACH_WEBSITE_FORM_WARM_ENROLL_ENABLED:-false}
      # In-container Gmail inbox drain (backend/intake/gmail_poll_task.py).
      # Operator directive 2026-07-06 (post morning-ritual): recurring
      # behaviours move OUT of Windows Task Scheduler and INTO the always-on
      # container. Default ON, 10-min cadence -- matches the retired
      # "Samus Inbox Poll" scheduled task, which stays disabled (belt-and-
      # suspenders) during the transition window. Set _ENABLED=0 to disarm
      # the container loop; when disarmed the poller is a full no-op (no
      # Gmail API round-trip, no CRM write). See gmail_poll_task.py.
      SAMUS_GMAIL_POLL_ENABLED: ${SAMUS_GMAIL_POLL_ENABLED:-1}
      SAMUS_GMAIL_POLL_INTERVAL_SEC: ${SAMUS_GMAIL_POLL_INTERVAL_SEC:-600}
      # Gmail OAuth credentials for backend.intake.gmail_poller.drain_once.
      # All three must be set for the poller to do anything -- unset leaves
      # drain_once returning enabled=False as a clean no-op (poller stays
      # disarmed rather than failing). Hydrated from DPAPI by
      # Start-SamusStack.ps1 (GmailInboxEmail / GmailOauthClientId /
      # GmailOauthClientSecret). The OAuth refresh token itself lives on the
      # mounted samus-data volume at
      # /opt/samus/data/intake/gmail_oauth_token.json (config default);
      # populate it once from the host via Authorize-Gmail.ps1 targeting the
      # same on-disk path the volume is mounted from.
      SAMUS_GMAIL_INBOX_EMAIL: ${SAMUS_GMAIL_INBOX_EMAIL:-}
      SAMUS_GMAIL_OAUTH_CLIENT_ID: ${SAMUS_GMAIL_OAUTH_CLIENT_ID:-}
      SAMUS_GMAIL_OAUTH_CLIENT_SECRET: ${SAMUS_GMAIL_OAUTH_CLIENT_SECRET:-}
      # Post-drain categorized forwarder (see backend/intake/email_forwarder.py).
      # When enabled, every processed message is re-sent FROM the polled inbox
      # TO SAMUS_FORWARD_TO_EMAIL with a [CATEGORY/INTENT] subject prefix, and
      # the original is trashed. Unclassifiable + low-confidence hits go to
      # [URGENT/UNCLASSIFIED] so the operator can eyeball them for training.
      SAMUS_FORWARD_ENABLED: ${SAMUS_FORWARD_ENABLED:-0}
      SAMUS_FORWARD_TO_EMAIL: ${SAMUS_FORWARD_TO_EMAIL:-}
      SAMUS_FORWARD_TRASH_ORIGINAL: ${SAMUS_FORWARD_TRASH_ORIGINAL:-1}
      SAMUS_FORWARD_CLASSIFY_MIN_CONFIDENCE: ${SAMUS_FORWARD_CLASSIFY_MIN_CONFIDENCE:-0.4}
      # Two-way calendar sync (backend.intake.calendar_poll_task).
      # Polls samushustleforge@'s primary Google Calendar every N seconds.
      # Operator-created events become CRM calendar_event artifacts + emit
      # calendar.event_scheduled. Events past their end time emit
      # calendar.event_completed. Samus-created events (source=samus.intake)
      # are recognized and skipped for ingest but still tracked for completion.
      SAMUS_CALENDAR_POLL_ENABLED: ${SAMUS_CALENDAR_POLL_ENABLED:-1}
      SAMUS_CALENDAR_POLL_INTERVAL_SEC: ${SAMUS_CALENDAR_POLL_INTERVAL_SEC:-300}
      # Stripe key -- OPTIONAL. When set the per-inbound-message billing
      # summary line reads "paid customer / subscribed / unknown" via
      # backend.finance.service.get_customer_billing_summary; when unset it
      # degrades to "billing lookup failed: stripe_api_key_unset" and the
      # artifact + operator task are still created. Kept scoped to intake
      # even though finance also holds this key -- the poller does the
      # lookup inline in this workcell.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256m
          pids: 128

  # ----- Voice ---------------------------------------------------------
  # Phase 1: Vapi outbound caller + inbound webhook receiver (Morgan SDR loop
  # from Samus/recovery/vapi_sales_agent_config.md). HTTP-only — no SQS
  # worker sidecar yet (no samus-voice-jobs queue).
  #
  # Networks: samus-edge AND samus-internal. Edge attachment mirrors the
  # feedback workcell — Vapi pushes webhook events from the public internet,
  # so the container must be reachable through the same Caddy/edge path that
  # serves /api/ses/feedback. No `ports:` block here either: local-dev
  # webhook testing uses an ngrok-style tunnel; VM ingress goes through
  # Caddy on host port :8080 (architecture doc reservation).
  #
  # VAPI_API_KEY is optional: outbound /voice/call degrades to
  # vapi_error=vapi_api_key_unset without it. VAPI_WEBHOOK_SECRET is
  # required for /vapi/webhook unless SAMUS_VOICE_VERIFY_WEBHOOK=0; a
  # missing secret returns 503 (refuse-don't-degrade for an inbound trust
  # boundary).
  samus-voice:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/voice/Dockerfile
    image: samus/voice:local
    container_name: samus-voice
    networks:
      - samus-edge
      - samus-internal
    ports:
      # Operator voice console (backend.voice.console): GET /console + the
      # token-gated /console/api/*. Unlike /vapi/webhook (public ingress via
      # the embedded ngrok tunnel / Caddy), the console is a host-browser
      # surface and needs a published port. Bound to 127.0.0.1 only — the
      # console is operator-local, and /console/api/* is additionally gated by
      # SAMUS_VOICE_CONSOLE_TOKEN.
      - "127.0.0.1:8107:8080"
    volumes:
      - samus-data:/opt/samus/data
      # Gap-4 durability (crash-proven 6/30): bind the ENTIRE artifacts dir to
      # host so the dialer's warm-exclusion source (buying_signal_enrollments),
      # the daily call lists, watches, and customer folders survive a host crash
      # and stay consistent with prospecting + outreach (one host source of
      # truth). Widened from the daily_calls-only bind after the 6/30 crash wiped
      # the named volume and lost Kelly's in-volume warm enrollment. Nested over
      # the samus-data volume; the bind shadows the volume's artifacts subdir.
      - type: bind
        source: ../../.data/host_artifacts
        target: /opt/samus/data/artifacts
        bind:
          create_host_path: true
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: voice
      VAPI_API_KEY: ${VAPI_API_KEY:-}
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET:-}
      # Morning dialer needs both. Empty -> /voice/dial_call_list refuses to
      # dial (no fallback). Both are Vapi dashboard UUIDs (account-binding,
      # not credentials) but stored DPAPI-side for the same reason as the API
      # key — keeps them out of any accidentally-committed .env diff.
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      # AI Digital Receptionist — the INBOUND assistant + its bound DID.
      # Separate Vapi assistant from the outbound dialer above (receptionist
      # persona, recording enabled). Empty -> inbound receptionist path is
      # off; the outbound surface is unaffected.
      VAPI_INBOUND_ASSISTANT_ID: ${VAPI_INBOUND_ASSISTANT_ID:-}
      VAPI_INBOUND_PHONE_NUMBER_ID: ${VAPI_INBOUND_PHONE_NUMBER_ID:-}
      # Voice does NOT open its own ngrok tunnel. The consolidated samus-ngrok
      # agent (below) fronts both finance and voice through ONE ngrok session
      # -- the free plan allows one agent session but three endpoints. Forced
      # empty so _run_tunnel_startup cleanly skips the embedded tunnel;
      # Sync-VoiceWebhook.ps1 points Morgan's server.url at the shared voice
      # tunnel after the stack comes up.
      NGROK_AUTHTOKEN: ""
      NGROK_RESERVED_DOMAIN: ""
      MEMORY_URL: http://samus-memory:8080
      # End-of-call CRM dispatch (Conversation + CallState upserts). Missing
      # -> _dispatch_to_crm silently returns crm_url_unset and every call's
      # outcome is lost to the CRM (observed 64% dispatch-fail 7/02; the rest
      # failed on lead extraction). The memory dispatch above always had its
      # URL — this one was never wired.
      CRM_URL: http://samus-crm:8080
      SAMUS_VOICE_AUDIT_PATH: /opt/samus/data/voice/voice_audit.jsonl
      # Rich-payload ledger (briefing rollup source). Parallel to the audit
      # log, which only stores hashes by design.
      SAMUS_VOICE_EVENTS_PATH: /opt/samus/data/voice/voice_events.jsonl
      # Operator browser console bearer token (backend.voice.console). Empty ->
      # every /console/api/* route returns 503 (fail-closed: no token, no
      # console; GET /console still serves the page shell). Seeded from DPAPI
      # 'VoiceConsoleToken' by Start-SamusStack.ps1.
      SAMUS_VOICE_CONSOLE_TOKEN: ${SAMUS_VOICE_CONSOLE_TOKEN:-}
      # WordPress Application Password — used by submit_product_page to create
      # draft pages in wp-admin after a validated offer surfaces on a call.
      # Credentials injected by Start-SamusStack.ps1 from DPAPI store.
      WORDPRESS_USERNAME: ${WORDPRESS_USERNAME:-}
      WORDPRESS_APP_PASSWORD: ${WORDPRESS_APP_PASSWORD:-}
      # Buying-signal email route (backend/outreach/buying_signal_route.py).
      # When armed, the end-of-call handler enrolls high-intent prospects into
      # the warm `buying_signal` sequence. ENROLLMENT only — sending stays a
      # separate dormant step (dispatch_due_buying_signal needs dry_run=False
      # AND an explicit composer; fail-closed otherwise). Scoped to this voice
      # block (not the shared anchor) so arming it recreates only samus-voice.
      OUTREACH_BUYING_SIGNAL_ROUTE_ENABLED: ${OUTREACH_BUYING_SIGNAL_ROUTE_ENABLED:-false}
      OUTREACH_BUYING_SIGNAL_INTENT_THRESHOLD: ${OUTREACH_BUYING_SIGNAL_INTENT_THRESHOLD:-70}
      # Mid-call adaptation bridge (backend/voice/autonomous.py). When ON, each
      # final user turn during a live Vapi call is fed to the adaptive layer and
      # the recommendation is recorded on the audit event. NEVER drives a dial —
      # voice_dial stays VR-G5-blocked unconditionally. Default OFF → byte-
      # identical log-and-drop. Scoped to this voice block so arming recreates
      # only samus-voice.
      SAMUS_VOICE_MIDCALL_ENABLED: ${SAMUS_VOICE_MIDCALL_ENABLED:-0}
      # Intraday session monitor (backend/voice/call_session_monitor.py). After
      # each end-of-call event, samples today's outcomes; on a negative streak /
      # positive-rate collapse / new-objection spike it fires a mid-session
      # strategy recalc and rewrites dynamic_callsheet_intel so the NEXT call in
      # the queue uses the corrected approach. Cooldown + min-calls floor guard
      # over-firing. Default OFF (dormant).
      SAMUS_VOICE_SESSION_MONITOR: ${SAMUS_VOICE_SESSION_MONITOR:-0}
      # No-callbacks (operator directive 2026-07-03). When ON, the end-of-call
      # handler skips the no-answer/voicemail retry-queue enqueue, so autonomous
      # calls are one-and-done — no scheduled re-dials. Applies to the cold-dial
      # lane's calls too (they carry no per-call no_callback tag). Prospect-
      # REQUESTED scheduled callbacks are a separate mechanism and unaffected.
      SAMUS_VOICE_NO_CALLBACK_ENABLED: ${SAMUS_VOICE_NO_CALLBACK_ENABLED:-false}
      # Prior-call profile context (backend/voice/prospect_profile.py). When ON,
      # the dialer merges prior_outcome / prior_notes / prior_contact_summary into
      # Vapi variableValues so Morgan's prompt can acknowledge a prior touch
      # instead of cold-pitching. Morgan's system prompt gates each var on
      # non-empty via LiquidJS, so an empty profile is byte-identical to a first
      # contact. Scoped to this voice block so arming recreates only samus-voice.
      SAMUS_VOICE_PROFILE_CONTEXT: "1"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

  # ----- ingress (public-webhook path router) --------------------------
  # Single front door behind the one ngrok tunnel. The ngrok free plan
  # POOLS same-account endpoints onto the one assigned dev domain, so the
  # previous two-tunnel layout (finance + voice) load-balanced the shared
  # domain between the two backends: Stripe webhooks randomly 404'd on
  # voice and Vapi end-of-call reports randomly 401'd on finance — silent,
  # probabilistic delivery loss (found 2026-07-03). Caddy path-routes
  # deterministically instead; each backend still enforces its own webhook
  # signature. No auth here BY DESIGN — see ingress/Caddyfile.
  samus-ingress:
    image: caddy:2-alpine
    container_name: samus-ingress
    networks:
      - samus-internal
    volumes:
      - ./ingress/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
          pids: 64

  # ----- ngrok (single consolidated webhook tunnel) --------------------
  # One ngrok agent fronts samus-ingress, which path-routes to finance
  # (Stripe) and voice (Vapi end-of-call). Tunnel defined in ngrok.yml
  # (mounted); the authtoken comes from NGROK_AUTHTOKEN. The public URL is
  # the stable assigned dev domain, so external webhook config (Stripe
  # dashboard, Vapi server.url) never needs re-pointing after restarts.
  samus-ngrok:
    # D5-DOCK-01 — pinned off :latest to the v3 manifest-list digest (multi-arch).
    # Re-resolve a bump via `docker buildx imagetools inspect ngrok/ngrok:3`.
    image: ngrok/ngrok:3@sha256:650a2c2f0b03e9254b4dcc412145aadacd807890860ba1c7663ac924d3e9c3a5
    container_name: samus-ngrok
    networks:
      - samus-internal
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - ./ngrok.yml:/etc/ngrok/ngrok.yml:ro
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN required for the webhook tunnels}
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    depends_on:
      - samus-ingress
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 64

  # ----- cloudflared (DocuSeal branded signing link) -------------------
  # Routes sign.hustleforge.tech → samus-docuseal:3000 through a
  # Cloudflare Tunnel (free). Independent of the ngrok webhook tunnel.
  # Create the tunnel in Zero Trust → Tunnels → "docuseal", pick Docker,
  # and paste the token into CLOUDFLARE_TUNNEL_TOKEN in .env (DPAPI-sealed).
  samus-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: samus-cloudflared
    # Opt-in only: hustleforge.tech DNS is on WordPress.com today, so the
    # tunnel has no Cloudflare zone to serve. Excluded from the default stack
    # until the NS migration; bring up with `--profile docuseal-tunnel`.
    profiles: ["docuseal-tunnel"]
    networks:
      - samus-internal
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      # Force HTTP/2 transport (TCP 7844). The default QUIC transport needs
      # outbound UDP 7844, which the host NAT / Docker Desktop blocks here
      # (observed: "failed to dial to edge with quic: timeout"). HTTP/2 rides
      # TCP, which the same path already allows for the ngrok tunnel.
      TUNNEL_TRANSPORT_PROTOCOL: http2
    command: ["tunnel", "--no-autoupdate", "run"]
    depends_on:
      - samus-docuseal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 32

  # =====================================================================
  # SQS worker sidecars
  #
  # Per Workcells doc §2 (Two Execution Modes) + §3.26 (BaseSqsWorker.
  # run_forever), every workcell that ships a `worker.py` runs as a long-
  # poll SQS consumer in addition to its HTTP app. The HTTP-app containers
  # above only serve synchronous /actions/* requests; without these
  # sidecars, messages dropped into SQS sit idle until visibility timeout
  # and then DLQ. The sidecars compete-consume the same queues as any
  # Cloud Run worker peer (local-primary, Cloud Run fallback).
  #
  # Each sidecar reuses the same image as its HTTP-app counterpart (no
  # build directive — depends_on the HTTP service so compose builds the
  # image once via that service). Command overrides the uvicorn CMD with
  # `python -m backend.<svc>.worker`. Workers run on samus-internal only
  # (no inbound HTTP) and have no `ports:` block. Idempotency is enforced
  # in DynamoDB per the worker_base contract.
  # =====================================================================

  # ----- Leadgen worker -----------------------------------------------
  samus-leadgen-worker:
    <<: *samus-common
    image: samus/leadgen:local
    container_name: samus-leadgen-worker
    command: ["python", "-m", "backend.leadgen.worker"]
    depends_on:
      samus-leadgen:
        condition: service_started
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: leadgen
      SQS_LEADGEN_QUEUE_URL: ${SQS_LEADGEN_QUEUE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pathlib,sys; sys.exit(0 if 'backend.leadgen.worker' in pathlib.Path('/proc/1/cmdline').read_text() else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

  # ----- Prospecting worker -------------------------------------------
  samus-prospecting-worker:
