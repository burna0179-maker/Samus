  # ----- Strategy -------------------------------------------------------
  # Phase 1: HTTP-only workcell — gateway routes inbound strategy requests
  # here; strategy reads CRM state and dispatches back through the gateway.
  # No SQS worker sidecar yet (no samus-strategy-jobs queue provisioned).
  # Internal-only: no edge network attachment, no published ports.
  samus-strategy:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/strategy/Dockerfile
    image: samus/strategy:local
    container_name: samus-strategy
    networks:
      - samus-internal
    volumes:
      - D:/Hustleforge/Samus/.data/containers:/opt/samus/data
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: strategy
      SAMUS_CRM_URL: http://samus-crm:8080
      SAMUS_GATEWAY_URL: http://samus-gateway:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
          pids: 128

