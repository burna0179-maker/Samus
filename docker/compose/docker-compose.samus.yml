# Samus local Compose stack — gateway + 5 workcells + Neo4j.
#
# Build context for every workcell is the Hustleforge repo root (parent of
# Samus/) so the Dockerfiles can COPY both `Samus/...` and `docker/...`.
# Run from that root:
#
#   docker compose -f Samus/docker/compose/docker-compose.samus.yml --env-file Samus/docker/compose/.env up -d
#
# Two networks:
#   - samus-edge: gateway is reachable from the host here.
#   - samus-internal: every service talks workcell-to-workcell here.

name: samus

x-samus-common: &samus-common
  restart: unless-stopped
  read_only: true
  # Read-only rootfs requires a writable /tmp for uvicorn / FastAPI temp files.
  # Short-form tmpfs entries are size-unbounded; container default cap is fine.
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # pids cap is set per-service under deploy.resources.limits.pids (Compose v5
  # forbids top-level pids_limit when a deploy block exists on the same service).
  init: false  # tini is PID 1 inside the image already
  environment: &samus-common-env
    PYTHONUNBUFFERED: "1"
    SAMUS_PORT: "8080"
    # LM Studio (OpenAI-compatible) on the host. Containers reach the host
    # via host.docker.internal; the default in llm_client.py targets 127.0.0.1
    # which is only correct on the host itself.
    # NOTE: base form (…/v1), NOT the full …/v1/chat/completions. local_llm.chat
    # appends /chat/completions itself; the old full-URL default double-appended
    # to …/chat/completions/chat/completions, which LM Studio answers 200 + EMPTY
    # choices — silently taking the whole offline reasoning stack dark (6/30).
    # local_llm now also normalises either form defensively.
    SAMUS_LM_STUDIO_URL: ${SAMUS_LM_STUDIO_URL:-http://host.docker.internal:1234/v1}
    # Free-local routing (2026-07-08): comma-separated workcells that ALWAYS
    # run on free LM Studio (unmetered — exempt from the paid $-cap + per-
    # workcell token quota), regardless of the global OPENAI_API_KEY switch.
    # Fixes cognition exhausting its 200k paid quota on work that runs free.
    SAMUS_LLM_FREE_WORKCELLS: ${SAMUS_LLM_FREE_WORKCELLS:-}
    # OpenAI = BACKUP backend for backend.common.local_llm. Local LM Studio is
    # primary (free, tried first); OpenAI is the fallback so the offline
    # reasoning stack (session monitor / strategy reasoner / callsheet updater /
    # pattern aggregator) degrades to a paid call instead of going dark when
    # local is empty/down. Hydrated from DPAPI OpenAiApiKey by Start-SamusStack.
    # Empty -> local-only (no fallback). SAMUS_LLM_PRIMARY flips the order.
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    SAMUS_LLM_PRIMARY: ${SAMUS_LLM_PRIMARY:-local}
    # DocuSeal contract signing (backend.contracts). Secrets are DPAPI-sealed at
    # the Samus scope and exported by Start-SamusStack.ps1. Default OFF -> the
    # campaign contract step + /docuseal/webhook stay dormant until
    # DOCUSEAL_ENABLED=true and the template id + token are set.
    DOCUSEAL_ENABLED: ${DOCUSEAL_ENABLED:-false}
    DOCUSEAL_API_BASE: ${DOCUSEAL_API_BASE:-http://samus-docuseal:3000/api}
    DOCUSEAL_API_TOKEN: ${DOCUSEAL_API_TOKEN:-}
    DOCUSEAL_PUBLIC_BASE: ${DOCUSEAL_PUBLIC_BASE:-}
    DOCUSEAL_SERVICE_AGREEMENT_TEMPLATE_ID: ${DOCUSEAL_SERVICE_AGREEMENT_TEMPLATE_ID:-}
    DOCUSEAL_WEBHOOK_SECRET: ${DOCUSEAL_WEBHOOK_SECRET:-}
    # Canonical ecosystem LM Studio vars (operator_console pod.py reads these)
    SN_LM_STUDIO_BASE_URL: ${SN_LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    SN_LM_STUDIO_MODEL: ${SN_LM_STUDIO_MODEL:-local}
    SAMUS_SHARED_HMAC_KEY: ${SAMUS_SHARED_HMAC_KEY:?SAMUS_SHARED_HMAC_KEY required}
    # Agora v2: Anita's peer key (so Samus can VERIFY Anita's HMAC AgentEnvelope
    # at POST /agora/contribute) + the contribute flag. Values come from the
    # compose .env (gitignored); empty -> the endpoint stays dormant/fail-closed.
    SS_HMAC_KEY_ANITA: ${SS_HMAC_KEY_ANITA:-}
    SS_HMAC_KEY_SAMUS: ${SS_HMAC_KEY_SAMUS:-}
    SN_AGORA_CONTRIBUTE_ENABLED: ${SN_AGORA_CONTRIBUTE_ENABLED:-}
    # Per-service HMAC keys (R-1 security remediation). Optional + additive:
    # a workcell whose key is unset falls back to SAMUS_SHARED_HMAC_KEY in
    # code, so the stack behaves identically whether 0 or all 21 are set.
    # Start-SamusStack.ps1 fills these from DPAPI (HmacKey_<service>); bulk-
    # seed with D:\tools\hustleforge-git\Seed-SamusHmacKeys.ps1.
    SAMUS_HMAC_KEY_CRM: ${SAMUS_HMAC_KEY_CRM:-}
    SAMUS_HMAC_KEY_ENTROPY: ${SAMUS_HMAC_KEY_ENTROPY:-}
    SAMUS_HMAC_KEY_FEEDBACK: ${SAMUS_HMAC_KEY_FEEDBACK:-}
    SAMUS_HMAC_KEY_FINANCE: ${SAMUS_HMAC_KEY_FINANCE:-}
    SAMUS_HMAC_KEY_FULFILLMENT: ${SAMUS_HMAC_KEY_FULFILLMENT:-}
    SAMUS_HMAC_KEY_GATEWAY: ${SAMUS_HMAC_KEY_GATEWAY:-}
    SAMUS_HMAC_KEY_INTAKE: ${SAMUS_HMAC_KEY_INTAKE:-}
    SAMUS_HMAC_KEY_LEADGEN: ${SAMUS_HMAC_KEY_LEADGEN:-}
    SAMUS_HMAC_KEY_MEMORY: ${SAMUS_HMAC_KEY_MEMORY:-}
    SAMUS_HMAC_KEY_OPTIMIZER: ${SAMUS_HMAC_KEY_OPTIMIZER:-}
    SAMUS_HMAC_KEY_OUTREACH: ${SAMUS_HMAC_KEY_OUTREACH:-}
    SAMUS_HMAC_KEY_PATH_OPTIMIZER: ${SAMUS_HMAC_KEY_PATH_OPTIMIZER:-}
    SAMUS_HMAC_KEY_PORTFOLIO_CONTROLLER: ${SAMUS_HMAC_KEY_PORTFOLIO_CONTROLLER:-}
    SAMUS_HMAC_KEY_PROPOSAL: ${SAMUS_HMAC_KEY_PROPOSAL:-}
    SAMUS_HMAC_KEY_PROSPECTING: ${SAMUS_HMAC_KEY_PROSPECTING:-}
    SAMUS_HMAC_KEY_SCAFFOLD: ${SAMUS_HMAC_KEY_SCAFFOLD:-}
    SAMUS_HMAC_KEY_SEO: ${SAMUS_HMAC_KEY_SEO:-}
    SAMUS_HMAC_KEY_SIGNAL_FILTER: ${SAMUS_HMAC_KEY_SIGNAL_FILTER:-}
    SAMUS_HMAC_KEY_STRATEGY: ${SAMUS_HMAC_KEY_STRATEGY:-}
    SAMUS_HMAC_KEY_TEMPLATE_RECOVERY: ${SAMUS_HMAC_KEY_TEMPLATE_RECOVERY:-}
    SAMUS_HMAC_KEY_VOICE: ${SAMUS_HMAC_KEY_VOICE:-}
    # Authorization enforcement mode for the per-service-key authz model:
    #   off | audit (log would-be denials, block nothing) | enforce (return
    #   403 on denial). ARMED to 'enforce' by default (HOTL Tranche 1 operator
    #   decision 2026-07-05); CALLER_GRANTS audited against all signed callers.
    SAMUS_AUTHZ_MODE: ${SAMUS_AUTHZ_MODE:-enforce}
    # File-integrity gate (red/blue drill 2026-06-30): off | audit (log drift) |
    # enforce (block tampered protected files). Must be referenced HERE, not just
    # in .env, to reach the container (env-anchor-vs-env-file rule).
    # ARMED to 'enforce' by default (HOTL Tranche 1). NOTE: the baseline's
    # operator Ed25519 signing ceremony is still pending (see
    # backend/identity/immutable_baseline.json.ed25519.signrequest.json) —
    # under env=production enforce fails closed until the ceremony completes;
    # dev/compose boots proceed with signature posture reported.
    SAMUS_IMMUTABLE_GATE_MODE: ${SAMUS_IMMUTABLE_GATE_MODE:-enforce}
    # Real-time operator alerting channel (notify_operator + morning_send). Empty
    # = alerting no-ops; paste a Discord webhook into .env to arm it.
    SAMUS_BRIEF_DISCORD_WEBHOOK: ${SAMUS_BRIEF_DISCORD_WEBHOOK:-}
    AWS_REGION: ${AWS_REGION:-us-west-1}
    # boto3 specifically reads AWS_DEFAULT_REGION; AWS_REGION is read by other
    # AWS SDKs but not by botocore's default region resolver. Set both so any
    # client (boto3 or its sibling libs) finds the region without an explicit
    # region_name kwarg.
    AWS_DEFAULT_REGION: ${AWS_REGION:-us-west-1}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID required}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY required}
    # Host-managed Neo4j (Hustleforge DBMS) reachable via Docker Desktop's
    # host.docker.internal alias. Operator runs the DBMS outside the compose;
    # the `samus` database is the per-agent partition.
    NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-samus}
    NEO4J_REQUIRED: ${NEO4J_REQUIRED:-false}
    # Artifact storage root. backend/common/storage.py defaults to the host
    # E:\Hustleforge\Samus\data\artifacts path which doesn't exist inside the
    # container; we redirect to the mounted samus-data volume so seo audits,
    # proposals, and other generated files persist across recreates.
    SAMUS_ARTIFACT_ROOT: /opt/samus/data/artifacts
    # State root for runtime-writable Codex Validation Layer state
    # (auto-drafted ADR stubs, resolved drafts, dedup ledger). Image is
    # read-only at /opt/samus/docs/codex/_drafts/, so the drafter routes
    # to ${SAMUS_STATE_ROOT}/codex_drafts/ + codex_resolved/ instead.
    SAMUS_STATE_ROOT: /opt/samus/data
    # Audit ledger root. backend/common/audit_ledger.py has the same
    # E:\Hustleforge\Samus\data host default as storage.py — invalid inside the
    # container, so the read-only mkdir fails (Errno 30) and tamper-evident
    # audit records are silently dropped (found 2026-07-06: gateway +
    # cash-engine-worker). Redirect to the mounted samus-data volume exactly
    # like SAMUS_ARTIFACT_ROOT / SAMUS_STATE_ROOT above; ledger then lands at
    # ${SAMUS_DATA_ROOT}/evidence/audit/ledger-YYYYMMDD.jsonl.
    SAMUS_DATA_ROOT: /opt/samus/data
    # Cross-agent Quorum Hub (MCP / JSON-RPC 2.0 on host:8090). Defaults are
    # dormant — publishing only fires when SAMUS_QUORUM_PUBLISH_ENABLED is
    # explicitly set to "1" (mirrors SAMUS_AUTHZ_MODE / SAMUS_DISCIPLINE_MODE
    # rollout posture). When dormant, the publisher short-circuits in-process
    # and never touches the network.
    SAMUS_QUORUM_PUBLISH_ENABLED: ${SAMUS_QUORUM_PUBLISH_ENABLED:-0}
    SAMUS_QUORUM_HUB_URL: ${SAMUS_QUORUM_HUB_URL:-http://host.docker.internal:8090}
    SAMUS_QUORUM_HUB_HMAC_KEY: ${SAMUS_QUORUM_HUB_HMAC_KEY:-}
    # PDC composite observer (informational; never gates). Flip to 1 to run
    # the composite after each EFH-pass in commercial_wrap.
    SAMUS_PDC_OBSERVE_ENABLED: ${SAMUS_PDC_OBSERVE_ENABLED:-0}
    # Runtime environment gate (backend.common.settings.is_production()).
    # 'development' (default) bypasses several fail-closed guards (Stripe
    # test-mode rejection, immutable gate, footerless-send refusal). Set to
    # 'production' for live customer-facing deploys. .env carries the
    # production value; the :-development fallback keeps dev shells safe.
    SAMUS_ENV: ${SAMUS_ENV:-development}
    # L1 resource broker (server on the Anita VM :8420) — DISABLED for Samus.
    # It gated contention for the shared local LM-Studio GPU ("route every
    # Anthropic call through Anita's broker"), but Samus now runs on OpenAI
    # (its own cloud account) and no longer touches that GPU. The broker was
    # fail-closed, so a down Anita VM aborted every Samus LLM call — a hard
    # dependency that kept a whole second agent alive for nothing. Samus's own
    # local budget/CODB cap still runs (llm_client gate, before the broker), so
    # cost control is unaffected. Flip back to "true" to re-couple. reserve()/
    # release() become no-ops when false (broker_client.py).
    SAMUS_BROKER_ENABLED: ${SAMUS_BROKER_ENABLED:-false}
    # CODB investment reasoner — Samus reasons over finances + CODB and surfaces
    # ranked, recommend-only reinvestment guidance (EOD section + guidance
    # ledger + Stripe deal-closed stimulus). ARMED 2026-07-02 by operator
    # directive ("agent needs to reason over finances and decide what CODB to
    # scale"). It cannot spend — records land as PROPOSED for operator approval.
    SAMUS_CODB_REASONER_ENABLED: ${SAMUS_CODB_REASONER_ENABLED:-true}
    # Email send (SendGrid Mail Send v3) shared by every workcell that can
    # dispatch outbound mail: finance (payment receipts), outreach (cold
    # outreach + retainer pitches), cash-engine-worker (cash_engine live-send
    # branch, which imports backend.outreach.service.send_message in-process
    # — see stages.py L412). Start-SamusStack.ps1 sources these from DPAPI
    # (SendgridApiKey / SendgridFromEmail / SendgridReplyTo). Default backend
    # is "sendgrid"; SENDGRID_FROM_NAME defaults to "HustleForge".
    EMAIL_BACKEND: ${EMAIL_BACKEND:-sendgrid}
    SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
    SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-HustleForge}
    SENDGRID_REPLY_TO: ${SENDGRID_REPLY_TO:-}
    # Gemini API key for the flyer-hero generator (scaffold/flyer_render.py).
    # When unset, flyer rendering degrades to an SVG fallback hero.
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    # --- SMMS port flags (ComplianceGuard / Heat / Karma / Reply / Attribution).
    # Default-OFF in code; production values set in .env. ComplianceGuard runs
    # 'audit' first (logs would-blocks + injects List-Unsubscribe headers, blocks
    # nothing) — flip to 'enforce' once the audit log confirms no legitimate send
    # would break (and the unsubscribe URL is on a stable domain). Heat arms the
    # throttle but stays signal-less until SENDGRID_WEBHOOK_VERIFICATION_KEY is set
    # + the SendGrid "Signed Event Webhook" points at the public /api/sendgrid/events.
    # Karma fail-opens to an innocent baseline (no-op for a well-behaved Samus).
    # Attribution stays off until a multi-variant catalog exists. DDB_* tables
    # fall back to a JSON store on the data volume when unset.
    SAMUS_COMPLIANCE_GUARD_MODE: ${SAMUS_COMPLIANCE_GUARD_MODE:-off}
    SAMUS_COMPLIANCE_FROM_DOMAINS: ${SAMUS_COMPLIANCE_FROM_DOMAINS:-}
    SAMUS_HEAT_FIELD_ENABLED: ${SAMUS_HEAT_FIELD_ENABLED:-false}
    SENDGRID_WEBHOOK_VERIFICATION_KEY: ${SENDGRID_WEBHOOK_VERIFICATION_KEY:-}
    DDB_HEAT_STATE_TABLE: ${DDB_HEAT_STATE_TABLE:-samus_heat_state}
    SAMUS_KARMA_GATE_ENABLED: ${SAMUS_KARMA_GATE_ENABLED:-false}
    DDB_KARMA_TABLE: ${DDB_KARMA_TABLE:-samus_karma}
    SAMUS_REPLY_HANDLING_ENABLED: ${SAMUS_REPLY_HANDLING_ENABLED:-false}
    SAMUS_ATTRIBUTION_ENABLED: ${SAMUS_ATTRIBUTION_ENABLED:-true}
    # Semantic axiom layer for the EthicalFailureHandler (fail-open).
    SAMUS_EFH_SEMANTIC: ${SAMUS_EFH_SEMANTIC:-true}
    DDB_ATTRIBUTION_TABLE: ${DDB_ATTRIBUTION_TABLE:-samus_attribution_variants}
    # ProtocolLayer feature flags (backend/governance/protocol_layer.py).
    # ISV = Major-issued capability voucher; dual_channel = audit-mirror to
    # Optimus. In production, BOTH require cryptographic material that must
    # be fleet-coordinated (SAMUS_MAJOR_PUBLIC_KEY_PATH + SAMUS_SIGNING_KEY_PATH).
    # Until that material is wired, leave them OFF so production boot stays
    # quiet — the cash path doesn't use these.
    SAMUS_ISV_CONSUMER_ENABLED: ${SAMUS_ISV_CONSUMER_ENABLED:-false}
    SAMUS_DUAL_CHANNEL_ENABLED: ${SAMUS_DUAL_CHANNEL_ENABLED:-false}
    # ADR-014: in-stack daily prospecting cadence. When true the prospecting
    # workcell starts an asyncio loop on boot (5-min settle delay then 24h
    # interval) that fires the same /work discover path the host scheduled
    # task used to. Default false; tonight 2026-06-23 we arm it and disable
    # the host 'Samus Prospecting Daily' task.
    SAMUS_PROSPECTING_IN_STACK_CADENCE_ENABLED: ${SAMUS_PROSPECTING_IN_STACK_CADENCE_ENABLED:-false}
    # Force-multiplier (Lever A): the control_tick auto-stake sweep promotes
    # qualified prospects (lead_score >= 75, owner_email present, no
    # existing opportunity, not contacted in 14d) to staked opportunities
    # so the cash_engine can walk them autonomously. Default false; arm
    # SAMUS_AUTO_STAKE_ENABLED=true when ready to let Samus run in parallel
    # with operator dials. Knobs: SAMUS_AUTO_STAKE_{MIN_LEAD_SCORE,
    # MAX_PER_SWEEP,RECENT_DAYS,SCAN_LIMIT}.
    SAMUS_AUTO_STAKE_ENABLED: ${SAMUS_AUTO_STAKE_ENABLED:-false}
    SAMUS_AUTO_STAKE_MIN_LEAD_SCORE: ${SAMUS_AUTO_STAKE_MIN_LEAD_SCORE:-}
    SAMUS_AUTO_STAKE_MAX_PER_SWEEP: ${SAMUS_AUTO_STAKE_MAX_PER_SWEEP:-}
    SAMUS_AUTO_STAKE_RECENT_DAYS: ${SAMUS_AUTO_STAKE_RECENT_DAYS:-}
    SAMUS_AUTO_STAKE_SCAN_LIMIT: ${SAMUS_AUTO_STAKE_SCAN_LIMIT:-}
    # Force-multiplier (Lever B): Apollo.io last-resort owner-contact
    # lookup for prospects whose on-site cascade yielded no owner_email.
    # Empty key = adapter is a no-op (default). Daily $-cap enforced by
    # the SHARED G11 store (apollo_budget.py + SAMUS_APOLLO_DAILY_BUDGET_USD,
    # default $5/day) — same ledger as backend.outreach.apollo_source.
    APOLLO_API_KEY: ${APOLLO_API_KEY:-}
    SAMUS_NOTE_DISTILLER_ARMED: ${SAMUS_NOTE_DISTILLER_ARMED:-false}
    # NOTE: SAMUS_STATE_ROOT (durable governance/observability state +
    # Codex Validation Layer state) is defined ONCE above at /opt/samus/data
    # — the writable samus-data volume root. A second definition here
    # (${SAMUS_STATE_ROOT:-/opt/samus/data/state}) was removed 2026-06-01: it
    # was a YAML duplicate key that fails strict Compose parsing (Compose
    # v2.29+/Docker 29.x), and its /state default diverged from the live
    # /opt/samus/data value the running stack uses. See state_paths.py.

networks:
  samus-edge:
    name: samus-edge
    driver: bridge
  samus-internal:
    name: samus-internal
    driver: bridge
    # NOTE: `internal: true` was removed — workcells need outbound HTTPS to
    # reach AWS (SQS, DynamoDB, SNS) and Google Places. Inter-
    # workcell isolation is now enforced at the application layer via the
    # HMAC middleware (backend.common.middleware.VerifyHMACMiddleware), not
    # at the Docker network layer.

volumes:
  samus-data:
    name: samus-data
  docuseal-data:
    name: samus-docuseal-data
  docuseal-db-data:
    name: samus-docuseal-db-data

# Host-managed Neo4j: the Hustleforge DBMS runs on the host (Aura/Neo4j Desktop)
# with per-agent databases (anita, darwin, hivemind, samus, sapphire, system).
# Workcells reach it via host.docker.internal:7687. Docker Desktop resolves
# host.docker.internal natively; for Linux engines the extra_hosts entry on
# each workcell maps it to the host-gateway IP.

x-host-neo4j: &host-neo4j
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ----- Data-volume initializer ---------------------------------------
  # Named docker volumes are created root-owned with 0755 perms by default.
  # All workcells run as non-root 'samus' (uid 10001) via the base image's
  # USER directive, so they cannot mkdir under /opt/samus/data on a fresh
  # volume -- every per-workcell audit ledger silently fails to persist
  # (caught at the JsonlLedger layer, logged as a warning).
  #
  # This init container runs once at compose-up under root, chowns the
  # mount, and exits. Every other service depends_on it so they start
  # only after the volume is samus-writable.
  samus-data-init:
    image: busybox:1.36
    container_name: samus-data-init
    user: "0:0"
    command:
      - sh
      - -c
      - "chown -R 10001:10001 /opt/samus/data && chmod -R u+rwX /opt/samus/data && echo 'samus-data ownership fixed'"
    volumes:
      - samus-data:/opt/samus/data
    restart: "no"

  # NOTE: the consolidated ngrok agent is defined ONCE, further down under
  # "----- ngrok (consolidated webhook tunnels) -----". An earlier duplicate
  # `samus-ngrok:` definition lived here (a YAML duplicate key that fails
  # strict Compose parsing — Docker 29.x rejects the whole file); it was the
  # less-complete stub (no 4040 publish, optional authtoken). Removed
  # 2026-06-07 (D5-DOCK-01) so the file parses; the canonical block below
  # carries the loopback inspector publish + required authtoken.

  # ----- Gateway (edge) ------------------------------------------------
  samus-gateway:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/gateway/Dockerfile
    image: samus/gateway:local
    container_name: samus-gateway
    networks:
      - samus-edge
      - samus-internal
    ports:
      # Bound to loopback (red/blue drill 2026-06-30): the gateway is the only
      # host-published service and /health + /metrics are unauthenticated
      # (gateway is the HMAC signer, name-exempt from VerifyHMACMiddleware).
      # /metrics enumerates every route + traffic pattern — keep it off-host.
      - "127.0.0.1:8100:8080"
    # The cross-agent Quorum Hub MCP server runs on the host at
    # 127.0.0.1:8090; the gateway subscribes to its /events SSE stream
    # (backend/standard/inter_agent/hub_subscriber.py). Reaching the host
    # requires the host.docker.internal alias — Docker Desktop sets this
    # on Windows by default, but Linux engines need the extra_hosts entry.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - samus-data:/opt/samus/data
      # The gateway runs the control-tick idle-production drive (self-pacing
      # engine). Its observer + campaign portfolio read the SAME artifact truth
      # the production services use — call lists, dial-run + email ledgers,
      # voicemail drafts. Bind host_artifacts here for parity with
      # samus-prospecting / samus-outreach / samus-voice; without it the gateway
      # sees only the named volume (no call lists) and the drive self-gates to
      # zero. Matches the "single source of truth shared across services" note
      # on those services. See project_samus_self_pacing_engine.
      - type: bind
        source: ../../.data/host_artifacts
        target: /opt/samus/data/artifacts
        bind:
          create_host_path: true
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: gateway
      # Cognition cadence right-sizing (Framework diagnosis 2026-07-08). The
      # strategic cognition loop ran every 60s with a ~1.4k-token prompt =>
      # 143 calls burned its full 200k/day LLM quota by 02:48 UTC, then sat
      # budget-locked the rest of the UTC day. Because the daily reset is
      # 00:00 UTC (= 17:00 PDT), the loop was dead through the entire Pacific
      # business day. 900s (15 min) makes ~96 calls/day (~134k tokens) span
      # the full day with headroom, cognition-only (no global base bump), no
      # extra spend. Tighten toward 600s only if paired with more budget.
      SAMUS_COGNITION_CADENCE_INTERVAL_SECONDS: ${SAMUS_COGNITION_CADENCE_INTERVAL_SECONDS:-900}
      # Self-pacing engine (ADR-016/017). WIRED, DEFAULT OFF: the idle-drive is
      # an observe-only no-op until SAMUS_IDLE_PRODUCTION_DRIVE_ENABLED=1. When
      # armed it self-initiates governed EMAIL + voicemail DRAFTS when idle in
      # business hours; it CANNOT place a live call (governed dial stays off +
      # cold list has no consent basis). Arm the governed-dial flag only once a
      # consented source + live dialer are bound (currently inert).
      SAMUS_IDLE_PRODUCTION_DRIVE_ENABLED: ${SAMUS_IDLE_PRODUCTION_DRIVE_ENABLED:-false}
      SAMUS_GOVERNED_AUTONOMOUS_DIAL_ENABLED: ${SAMUS_GOVERNED_AUTONOMOUS_DIAL_ENABLED:-false}
      # Checkout-funnel gate (backend/catalog/funnel_health.py). WIRED, default
      # OFF: the idle-drive email channel consults a cached funnel-health
      # snapshot before pushing catalog buy-links. Disarmed it only LOGS when
      # the funnel is degraded; armed it makes the email campaign ineligible
      # while a CATALOG/live-code link is stale (scoped consider_wp=False, so a
      # stale WordPress-page link never halts email). Only bites when a fresh
      # snapshot exists — the morning brief lazily refreshes (refresh_if_stale)
      # whenever the snapshot exceeds the 6h TTL, or run manually:
      #   python -m backend.catalog.funnel_health --wp
      SAMUS_FUNNEL_GATE_ENABLED: ${SAMUS_FUNNEL_GATE_ENABLED:-false}
      # Starvation-aware self-supply (backend/cash_engine/self_supply.py).
      # WIRED, DEFAULT OFF: when the idle-drive portfolio initiates zero
      # campaigns because today's call list is missing, the tick fires the
      # prospecting workcell's daily_supply producer itself instead of
      # depending on a host scheduled task (which silently skipped 7/03 and
      # starved the whole morning). Diagnosis reports even while disarmed.
      SAMUS_SELF_SUPPLY_ENABLED: ${SAMUS_SELF_SUPPLY_ENABLED:-false}
      # Hot-gate threshold for the idle-drive email channel (operator policy
      # knob; empty -> morning_batch's own default 70). 7/03: thin ring
      # topped out at score 66 -> operator set 60 to trade quality for volume.
      SAMUS_EMAIL_HOT_MIN_SCORE: ${SAMUS_EMAIL_HOT_MIN_SCORE:-}
      # Production pulse (operator directive 7/03): idle-signal-driven
      # campaign progression — the idle-drive reasoning re-evaluates every
      # PULSE_SEC instead of once per 30-min control tick, with a pulse-scale
      # idle threshold. Pacing lives in the caps + governors (per-pass caps,
      # affordability intensity, suppression/dedup, send ramp, dial daily cap,
      # TCPA + business-hours gates), not in dead air between metronome ticks.
      SAMUS_PRODUCTION_PULSE_ENABLED: ${SAMUS_PRODUCTION_PULSE_ENABLED:-false}
      SAMUS_PRODUCTION_PULSE_SEC: ${SAMUS_PRODUCTION_PULSE_SEC:-120}
      SAMUS_PRODUCTION_IDLE_THRESHOLD_S: ${SAMUS_PRODUCTION_IDLE_THRESHOLD_S:-300}
      # CAN-SPAM footer inputs for the idle-drive's in-gateway email channel.
      # The compliance guard fail-closes every send without them — found
      # 7/03 when the first autonomous batch blocked on
      # postal_address_unconfigured (previously only the host CLI and the
      # cash-engine worker carried these).
      SAMUS_SENDER_POSTAL_ADDRESS: ${SAMUS_SENDER_POSTAL_ADDRESS:-}
      SAMUS_UNSUBSCRIBE_URL: ${SAMUS_UNSUBSCRIBE_URL:-}
      # EOD triangulation leg C = Claude via the Anthropic API (DPAPI-seeded by
      # Start-SamusStack as AnthropicApiKey -> ANTHROPIC_API_KEY). Passed into the
      # gateway (where the intelligence cycle runs) so the daily EOD review gets a
      # genuinely independent third model. Absent key => local-auditor fallback.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SAMUS_CLAUDE_MODEL: ${SAMUS_CLAUDE_MODEL:-claude-sonnet-5}
      # Operator console bearer token. Same value forge-ui uses to call
      # /api/console/chats (it reads ForgeUi_SamusApiToken from LocalMachine
      # DPAPI and sends it as `Authorization: Bearer <token>`). The
      # operator_console pack at /api/console/* fail-closes with 503 when
      # this is unset in production (SAMUS_ENV=production). Start-SamusStack.ps1
      # reads ForgeUi_SamusApiToken from LocalMachine DPAPI and exports it
      # here so the two sides match without a parallel DPAPI entry.
      SAMUS_OPERATOR_TOKEN: ${SAMUS_OPERATOR_TOKEN:-}
      # LLM-budget broker (resource_broker pack on Anita, port 8420). The
      # cognition workcell reserves tokens here before calling the LLM. The
      # client default is 127.0.0.1:8420 which is the container itself; from
      # inside the gateway we have to point at the host. Mirrors the
      # SAMUS_LM_STUDIO_URL pattern above. Without this, REASON in the
      # cognition loop fails fail-closed every tick with broker_unreachable.
      SAMUS_BROKER_BASE_URL: ${SAMUS_BROKER_BASE_URL:-https://host.docker.internal:8420}
      # Operator-relief forwarder (mirror stale pending_stake deals to Anita's
      # Agora). Only the gateway runs it (lifespan task). 2026-06-03.
      SAMUS_AGORA_RELIEF_FORWARD_ENABLED: ${SAMUS_AGORA_RELIEF_FORWARD_ENABLED:-false}
      SAMUS_AGORA_RELIEF_FORWARD_STALENESS_SEC: ${SAMUS_AGORA_RELIEF_FORWARD_STALENESS_SEC:-21600}
      # Cross-agent Quorum Hub subscription (host MCP server at :8090).
      # Set QUORUM_HUB_SUBSCRIBE_DISABLED=1 to skip starting the subscriber
      # (e.g. when the hub server isn't running). The subscriber's own
      # reconnect loop tolerates a missing hub, so leaving this unset is
      # safe even if the hub is down at boot.
      QUORUM_HUB_SSE_URL: ${QUORUM_HUB_SSE_URL:-http://host.docker.internal:8090/events}
      QUORUM_HUB_SUBSCRIBE_DISABLED: ${QUORUM_HUB_SUBSCRIBE_DISABLED:-}
      LEADGEN_URL: http://samus-leadgen:8080
      PROSPECTING_URL: http://samus-prospecting:8080
      SCAFFOLD_URL: http://samus-scaffold:8080
      FULFILLMENT_URL: http://samus-fulfillment:8080
      MEMORY_URL: http://samus-memory:8080
      CRM_URL: http://samus-crm:8080
      # FINANCE_URL lets the voice workcell POST inbound-call usage to the
      # finance /meter-event route (AI Digital Receptionist metered billing).
      FINANCE_URL: http://samus-finance:8080
      SIGNAL_FILTER_URL: http://samus-signal-filter:8080
      PATH_OPTIMIZER_URL: http://samus-path-optimizer:8080
      TEMPLATE_RECOVERY_URL: http://samus-template-recovery:8080
      PORTFOLIO_CONTROLLER_URL: http://samus-portfolio-controller:8080
      ENTROPY_URL: http://samus-entropy:8080
      SQS_LEADGEN_QUEUE_URL: ${SQS_LEADGEN_QUEUE_URL:-}
      SQS_PROSPECTING_QUEUE_URL: ${SQS_PROSPECTING_QUEUE_URL:-}
      SQS_SCAFFOLD_QUEUE_URL: ${SQS_SCAFFOLD_QUEUE_URL:-}
      SQS_FULFILLMENT_QUEUE_URL: ${SQS_FULFILLMENT_QUEUE_URL:-}
      SQS_CRM_QUEUE_URL: ${SQS_CRM_QUEUE_URL:-}
      # Cash Engine front door (POST /api/samus/review_opportunity) + the
      # signal_decay trigger enqueue RevenueTriggerEnvelopes here. Unset ->
      # the engine falls back to the local JSONL mock queue (drained via
      # POST /api/samus/cash_engine/drain); set it to go live on SQS.
      SQS_CASH_ENGINE_QUEUE_URL: ${SQS_CASH_ENGINE_QUEUE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
          pids: 256

  # ----- Prospecting --------------------------------------------------
  samus-prospecting:
