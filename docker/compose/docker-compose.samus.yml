    container_name: samus-prospecting
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
      # Gap-4 durability (crash-proven 6/30): the ENTIRE artifacts dir is bound
      # to the host host_artifacts dir so crash-critical mutable state —
      # buying_signal enrollments, open-no-click watches, campaign ledgers,
      # customer folders, daily call lists — survives a host crash AND is the
      # single source of truth shared across services (no host/container
      # divergence). Previously only daily_calls was bound; the 6/30 host crash
      # wiped the named volume and lost Kelly's warm enrollment (in-volume only),
      # which would have caused a warm prospect to be cold-dialed. Path is
      # relative to this compose file's dir (../../.. = repo root). Nested over
      # the samus-data volume; the bind shadows the volume's artifacts subdir.
      - type: bind
