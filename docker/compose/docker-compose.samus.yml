  # ----- Outreach -----------------------------------------------------
  # ----- DocuSeal document signing (self-hosted, third-party image) -----
  # Customer contract e-signing. Samus (outreach) calls the API over the
  # internal network at http://samus-docuseal:3000/api; the completion webhook
  # posts back to http://samus-outreach:8080/docuseal/webhook. Customer signing
  # links are published through the ingress (see ingress/Caddyfile + the public
  # exposure note in docs). NOT a Samus workcell, so it does not inherit
  # *samus-common. Pin a version tag in production instead of :latest.
  samus-docuseal-db:
    image: postgres:16-alpine
    container_name: samus-docuseal-db
    restart: unless-stopped
    networks:
      - samus-internal
    environment:
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: ${DOCUSEAL_DB_PASSWORD:?DOCUSEAL_DB_PASSWORD required}
      POSTGRES_DB: docuseal
    volumes:
      - docuseal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  samus-docuseal:
    image: docuseal/docuseal:latest
    container_name: samus-docuseal
    restart: unless-stopped
    depends_on:
      samus-docuseal-db:
        condition: service_healthy
    networks:
      - samus-internal
    ports:
      # Operator-only admin UI, bound to loopback. The public customer signing
      # surface (/s/*, /disk/*, assets) is served through samus-ingress/Caddy,
      # which blocks /admin*, /api*, /templates* by design — so template
      # management happens here on localhost, never on the public edge.
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://docuseal:${DOCUSEAL_DB_PASSWORD:?DOCUSEAL_DB_PASSWORD required}@samus-docuseal-db:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE:?DOCUSEAL_SECRET_KEY_BASE required}
      # Public host the signing links resolve on (via the ingress). DocuSeal
      # builds absolute URLs from this; TLS is terminated upstream at the tunnel,
      # so FORCE_SSL stays off inside the network.
      HOST: ${DOCUSEAL_HOST:-}
      FORCE_SSL: "false"
    volumes:
      - docuseal-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  samus-outreach:
    <<: *samus-common
    build:
      context: ../../..
      dockerfile: Samus/docker/workcells/outreach/Dockerfile
    image: samus/outreach:local
    container_name: samus-outreach
    networks:
      - samus-internal
    volumes:
      - samus-data:/opt/samus/data
      # Gap-4 durability: outreach writes buying_signal enrollments, open-no-click
      # watches, and campaign ledgers — all crash-critical. Bind the artifacts dir
      # to host so they survive a crash and stay consistent with voice +
      # prospecting (one host source of truth). See the voice/prospecting blocks.
      - type: bind
        source: ../../.data/host_artifacts
        target: /opt/samus/data/artifacts
        bind:
          create_host_path: true
      # Per-client campaign config read by backend.campaigns.contract_wire on
      # DocuSeal submission.completed to auto-start the bound campaign. RO
      # bind: operators add clients/<slug>/campaign.yaml without a rebuild.
      - type: bind
        source: ../../clients
        target: /opt/samus/clients
        read_only: true
    environment:
      <<: *samus-common-env
      SAMUS_SERVICE: outreach
      SQS_OUTREACH_QUEUE_URL: ${SQS_OUTREACH_QUEUE_URL:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
          pids: 256

