  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-strategy:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-strategy:latest"
  # --- 5 new workcells (signal_filter, path_optimizer, template_recovery,
  #     portfolio_controller, entropy). HTTP-only, internal ingress, port 8080.
  #     Dockerfiles are added by the integration that introduces them; the tags
  #     are listed here so this reference enumerates the full 21-workcell stack.
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-signal-filter:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-signal-filter:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-path-optimizer:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-path-optimizer:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-template-recovery:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-template-recovery:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-portfolio-controller:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-portfolio-controller:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-entropy:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-entropy:latest"

steps:
  # ---------------------------------------------------------------- base
  - id: build-base
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Samus/docker/base/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:latest"
      - .

  - id: push-base
    name: gcr.io/cloud-builders/docker
    waitFor: ["build-base"]
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base"

  # Trivy CVE gate on the freshly built base image. Pinned to 0.55.0. Scans the
  # local tag, fails on HIGH/CRITICAL with an available fix, emits table to
  # stdout + SARIF to /workspace for archival. /workspace doubles as the Trivy
  # DB cache so the gateway/feedback scans reuse the downloaded vuln database.
  - id: scan-base
    name: aquasec/trivy:0.55.0
    waitFor: ["build-base"]
    args:
      - image
      - --severity=HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code=1
      - --no-progress
      - --cache-dir=/workspace/.trivy-cache
      - --format=sarif
      - --output=/workspace/trivy-base.sarif
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:${SHORT_SHA}"

  - id: scan-base-table
    name: aquasec/trivy:0.55.0
    waitFor: ["scan-base"]
    args:
      - image
      - --severity=HIGH,CRITICAL
      - --ignore-unfixed
      - --exit-code=0
      - --no-progress
      - --cache-dir=/workspace/.trivy-cache
      - --format=table
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:${SHORT_SHA}"

  # ----------------------------------------------------------- workcells
  - id: build-gateway
    name: gcr.io/cloud-builders/docker
    waitFor: ["push-base", "scan-base"]
    args:
      - build
      - --build-arg
      - "BASE_IMAGE=${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:${SHORT_SHA}"
      - -f
      - Samus/docker/workcells/gateway/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-gateway:${SHORT_SHA}"
      - -t
      - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-gateway:latest"
      - .

  - id: build-prospecting
