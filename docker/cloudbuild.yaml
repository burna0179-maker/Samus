  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-feedback:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-feedback:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-outreach:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-outreach:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-optimizer:${SHORT_SHA}"
