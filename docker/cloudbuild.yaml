# =============================================================================
# DEPRECATED -- KEPT FOR REFERENCE ONLY. DO NOT SUBMIT.
#
# Cloud Build is no longer the deploy path for Samus. Cloud Build runtime VMs
# in project `${GCP_PROJECT}` (created after Apr 2024) cannot push to Artifact
# Registry even with the correct IAM bindings -- the build VM's OAuth scope is
# locked down and `docker push` returns 403. This dead-ended the whole flow.
#
# The CURRENT deploy path is a LOCAL `docker build` + `docker push` from the
# operator host, then `gcloud run deploy`. See `Samus/docker/DEPLOY.md`:
#   - section 4  -- the local build + push + deploy runbook
#   - section 6  -- why Cloud Build was abandoned
# The local-deploy helper is `Deploy-SamusLocal.ps1` (under D:\tools\hustleforge-git\).
#
# This file is retained as a correct, current REFERENCE of the build/deploy
# topology -- the exact `docker build` and `gcloud run deploy` invocations the
# local path performs are equivalent to the steps below. Image tags, project
# id, region, AR repo, secret bindings, and the full 21-workcell enumeration
# are all kept accurate so this stays a faithful map of the deploy. It is just
# never submitted to `gcloud builds submit`.
#
# Project: ${GCP_PROJECT}   Region: us-west1   AR repo: samus
# =============================================================================
#
# Build context is the Hustleforge repo root (parent of Samus/). The historical
# (now-broken) submit was:
#
#   gcloud builds submit --config=Samus/docker/cloudbuild.yaml \
#       --substitutions=_REGION=us-west1 --project=${GCP_PROJECT} .
#
# Reference topology:
#   step 0       build + push samus-base (tagged $SHORT_SHA and :latest)
#   step 1..21   build + push each workcell against the SHA-pinned base
#   scan steps   Trivy HIGH/CRITICAL gate on base + gateway + feedback
#   deploy steps deploy each workcell to Cloud Run as samus-<workcell>-2026
#
# Cloud Run forwards public port 8080 to the container's 8080 (matches the
# Dockerfile EXPOSE). Ingress is internal except feedback / finance / voice,
# which are ingress=all because they receive third-party webhook callbacks.

substitutions:
  _REGION: us-west1
  _PROJECT: ${GCP_PROJECT}
  _AR_REPO: samus
  _SERVICE_ACCOUNT: ${SAMUS_RUNTIME_SA}@${GCP_PROJECT}.iam.gserviceaccount.com
  # AWS region uses the hyphenated convention (us-west-1) -- distinct from the
  # GCP _REGION substitution (us-west1). Every workcell ships boto3, so every
  # Cloud Run service needs an AWS region resolvable from env. Set on every
  # deploy step under --set-env-vars; the matching IAM keys are bound via
  # --set-secrets from Secret Manager (aws-access-key-id, aws-secret-access-key).
  _AWS_REGION: us-west-1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-base:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-gateway:${SHORT_SHA}"
