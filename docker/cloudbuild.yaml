  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-proposal:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-seo:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-seo:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-finance:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-finance:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT}/${_AR_REPO}/samus-voice:${SHORT_SHA}"
