name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check backend tests

      - name: ruff format --check
        run: ruff format --check backend tests

  supply-chain:
    name: Supply-chain audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        # Non-blocking: pip-audit surfaces advisories against the pinned
        # requirements.txt. A finding here is a signal to review, not a merge
        # blocker — hard blocking would push runtime pinning decisions onto
        # the CI cadence rather than the operator.
        run: pip-audit --requirement requirements.txt --strict || true
