name: Typecheck

# Static type analysis on the shared platform library. mypy's default
# posture (report type conflicts, ignore missing annotations) matches the
# reality of a codebase where type hints are added incrementally rather
# than mandated upfront. When backend/common/ hardens to full annotation
# coverage the config in pyproject.toml can flip disallow_untyped_defs on.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy backend/common
