name: Trivy

# Filesystem and Dockerfile scanning. Two passes:
#   1. Filesystem — scans requirements.txt / requirements.lock for CVEs
#      in the pinned dependency graph.
#   2. Config — scans the 22 workcell Dockerfiles + base image for
#      misconfigurations (root user, missing --no-install-recommends,
#      unpinned base tags, etc.).
# Both upload SARIF to the Security tab. Non-blocking on findings — the
# signal is in the Security tab trend, not in a red CI badge that trains
# the operator to ignore it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan against updated CVE feeds even without commits.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filesystem:
    name: Filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

  dockerfile-config:
    name: Dockerfile config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: docker/
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload config SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-dockerfile-config
