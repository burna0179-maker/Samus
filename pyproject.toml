[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samus"
version = "0.1.0"
description = "HustleForge Samus agent — queue-backed AI sales engine."
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alex Hartman", email = "hartman530@gmail.com" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff's default selection is E + F + W — the intersection of pycodestyle and
# pyflakes that catches real correctness bugs without style debates.
# Style-debate exceptions kept OFF for velocity + intentional patterns:
#   E402  — module-import-not-at-top-of-file: several modules set env before
#           importing dependent submodules; this is intentional.
#   E741  — ambiguous-variable-name (l, I, O): used inside math loops and
#           reward-density arithmetic where the single-letter is the natural name.
#   F841  — unused-variable: cases like ``_ = expr`` are intentional; also
#           test fixtures often capture a value for future assertion expansion.
ignore = ["E402", "E741", "F841"]

[tool.ruff.format]
# Match the existing repo convention (double quotes, no trailing comma quirks).
quote-style = "double"

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
# Third-party stubs are patchy across boto3, neo4j, prometheus_client. Missing
# imports would swamp the signal — this keeps the report focused on real
# type conflicts inside our own code.
ignore_missing_imports = true
follow_imports = "silent"
# Loose baseline: report actual type errors, don't demand annotations on
# every function. Flip disallow_untyped_defs to true when backend/common/
# reaches full annotation coverage.
disallow_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true

# Per-module overrides: files with real type gaps documented in
# KNOWN_TECHNICAL_DEBT.md. Ignored here rather than annotated inline so the
# type-check job clears while typing coverage is being brought up incrementally.
# Remove entries as each module is properly annotated.
[[tool.mypy.overrides]]
module = [
    "backend.common.architecture_snapshot",
    "backend.common.audit_ledger",
    "backend.common.autonomy",
    "backend.common.codex.parser",
    "backend.common.dates",
    "backend.common.dynamodb",
    "backend.common.flags.store",
    "backend.common.llm_budget",
    "backend.common.net_limits",
]
ignore_errors = true

[tool.coverage.run]
source = ["backend/common"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
show_missing = true
skip_covered = false
